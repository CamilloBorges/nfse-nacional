sonar.projectKey=nfse-nacional
sonar.projectName=NFS-e Nacional (Directus)

# Código-fonte dos dois pacotes; os testes do núcleo ficam em packages/core/test.
sonar.sources=packages/core/src,packages/directus-extension/src,scripts
sonar.tests=packages/core/test
sonar.test.inclusions=**/*.test.ts

# Cobertura do Vitest (pnpm test:coverage), com os caminhos já relativos à raiz (ver workflow Sonar).
sonar.javascript.lcov.reportPaths=packages/core/coverage/lcov.info

# A extensão e os scripts são exercitados pelo teste de ponta a ponta (Directus real em Docker),
# que não gera cobertura de linha; ficam fora do cálculo de cobertura, mas dentro da análise.
sonar.coverage.exclusions=packages/directus-extension/**,scripts/**,packages/core/src/cli.ts

sonar.exclusions=**/dist/**,**/node_modules/**,**/coverage/**
